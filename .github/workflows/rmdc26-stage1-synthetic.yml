name: RMDC26 synthetic verification

# This workflow uses only synthetic tables/light curves. No RMDC26 challenge
# data are downloaded, embedded, or required for the public regression checks.
on:
  pull_request:
    paths:
      - 'scripts/fit_rmdc26_1s1l_baseline_v022.py'
      - 'scripts/select_rmdc26_stage2_canary_v010.py'
      - 'tests/test_rmdc26_1s1l_baseline_v022.py'
      - 'tests/test_select_rmdc26_stage2_canary_v010.py'
      - 'requirements-rmdc26.txt'
      - '.github/workflows/rmdc26-stage1-synthetic.yml'
      - 'docs/rmdc26/SOURCE_INTEGRITY.md'
  push:
    branches:
      - main
    paths:
      - 'scripts/fit_rmdc26_1s1l_baseline_v022.py'
      - 'scripts/select_rmdc26_stage2_canary_v010.py'
      - 'tests/test_rmdc26_1s1l_baseline_v022.py'
      - 'tests/test_select_rmdc26_stage2_canary_v010.py'
      - 'requirements-rmdc26.txt'
      - '.github/workflows/rmdc26-stage1-synthetic.yml'
      - 'docs/rmdc26/SOURCE_INTEGRITY.md'

permissions:
  contents: read

jobs:
  synthetic-rmdc26:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-rmdc26.txt

      - name: Install RMDC26 public test dependencies
        run: python -m pip install -r requirements-rmdc26.txt

      - name: Compile public RMDC26 scripts
        run: |
          python -m py_compile scripts/fit_rmdc26_1s1l_baseline_v022.py
          python -m py_compile scripts/select_rmdc26_stage2_canary_v010.py

      - name: Verify archived Stage 1 semantic identity
        run: |
          python - <<'PY'
          import hashlib
          import io
          import json
          import tokenize
          from pathlib import Path

          path = Path('scripts/fit_rmdc26_1s1l_baseline_v022.py')
          raw = path.read_bytes()
          skip = {
              tokenize.ENCODING,
              tokenize.NL,
              tokenize.NEWLINE,
              tokenize.INDENT,
              tokenize.DEDENT,
              tokenize.ENDMARKER,
          }
          tokens = [
              (token.type, token.string)
              for token in tokenize.tokenize(io.BytesIO(raw).readline)
              if token.type not in skip
          ]
          payload = json.dumps(
              tokens,
              separators=(',', ':'),
              ensure_ascii=False,
          ).encode('utf-8')
          actual = hashlib.sha256(payload).hexdigest()
          expected = 'f807ed36ece635af3187085131b51e5706d47f61b9723797179149ed5b9039c7'
          print('NORMALIZED_TOKEN_SHA256=', actual)
          if actual != expected:
              raise SystemExit('Stage 1 token-stream integrity hash mismatch')
          print('STAGE1_SEMANTIC_IDENTITY=PASS')
          PY

      - name: Run synthetic Stage 1 regression test
        env:
          PYTHONPATH: scripts
        run: python tests/test_rmdc26_1s1l_baseline_v022.py

      - name: Run synthetic Stage 2 canary-selection test
        env:
          PYTHONPATH: scripts
        run: python tests/test_select_rmdc26_stage2_canary_v010.py
